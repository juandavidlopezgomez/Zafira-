<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>BattleFlirt</title>
<style>
:root{
  --battle:#ff2d55;--battle-dark:#cc2444;--battle-glow:#ff2d5540;
  --llamas:#ff6b00;--llamas-dark:#cc5500;--llamas-glow:#ff6b0040;
  --bg:#0a0a0f;--surface:#12121a;--surface-light:#1a1a26;
  --muted:#2a2a3a;--border:#2a2a3a;
  --text:#f0f0f5;--text-muted:#8888a8;
  --green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--yellow:#eab308;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;
}
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--battle)}

/* ── Layout ── */
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.page{flex:1;padding:16px 16px 88px;overflow-y:auto}

/* ── Toast ── */
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{padding:12px 16px;border-radius:var(--r-md);font-size:13px;font-weight:500;animation:slideDown .25s ease;pointer-events:auto;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.toast-s{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#4ade80}
.toast-e{background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.4);color:#ff6b8a}
.toast-i{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);color:#93c5fd}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ── Bottom Nav ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:50;backdrop-filter:blur(8px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 14px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:10px;font-weight:500;transition:color .15s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--battle)}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--battle),var(--llamas));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.card-sm{background:var(--surface-light);border:1px solid var(--border);border-radius:var(--r-md);padding:12px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r-md);cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-battle{background:var(--battle);color:#fff;padding:12px 20px;width:100%;box-shadow:0 0 16px 2px var(--battle-glow)}
.btn-battle:hover{background:var(--battle-dark);box-shadow:0 0 28px 4px rgba(255,45,85,.5)}
.btn-llamas{background:var(--llamas);color:#fff;padding:12px 20px;width:100%;box-shadow:0 0 16px 2px var(--llamas-glow)}
.btn-llamas:hover{background:var(--llamas-dark)}
.btn-surface{background:var(--surface-light);color:var(--text);padding:12px 20px;border:1px solid var(--border);width:100%}
.btn-surface:hover{background:var(--muted)}
.btn-sm{padding:7px 14px;font-size:12px;width:auto}
.btn-icon{padding:8px;width:auto;background:var(--surface-light);border:1px solid var(--border);border-radius:var(--r-sm)}

/* ── Inputs ── */
input,select,textarea{background:var(--surface-light);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 14px;width:100%;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--battle)}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block;font-weight:500}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}

/* ── Auth screen ── */
.auth-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:24px}
.auth-logo{font-size:52px;font-weight:900;background:linear-gradient(135deg,var(--battle),var(--llamas));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;line-height:1}
.auth-sub{font-size:14px;color:var(--text-muted);text-align:center;margin-top:-8px}

/* ── Chips / Badges ── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.chip-battle{background:rgba(255,45,85,.12);color:var(--battle);border:1px solid rgba(255,45,85,.3)}
.chip-llamas{background:rgba(255,107,0,.12);color:var(--llamas);border:1px solid rgba(255,107,0,.3)}
.chip-green{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.chip-blue{background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.chip-purple{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.chip-muted{background:var(--muted);color:var(--text-muted);border:1px solid var(--border)}

/* ── Game mode grid ── */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-card{background:var(--surface-light);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.mode-card:hover,.mode-card.selected{border-color:rgba(255,45,85,.5);background:rgba(255,45,85,.07);box-shadow:0 0 16px 2px rgba(255,45,85,.15)}
.mode-card .m-icon{font-size:22px;flex-shrink:0}
.mode-card .m-name{font-size:13px;font-weight:600;line-height:1.2}
.mode-card .m-sub{font-size:10px;color:var(--text-muted);margin-top:2px}

/* ── Player list ── */
.player-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface-light);border-radius:var(--r-md);border:1px solid var(--border)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--battle),var(--llamas));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}

/* ── Challenge ── */
.challenge-box{background:var(--surface);border-radius:var(--r-lg);padding:24px;text-align:center;border:1px solid rgba(255,45,85,.3);box-shadow:0 0 40px 4px rgba(255,45,85,.1)}
.challenge-type{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.challenge-text{font-size:18px;font-weight:600;line-height:1.5;color:var(--text);margin:12px 0 20px}

/* ── Chat (Hilo) ── */
.msg{max-width:78%;word-break:break-word;padding:10px 13px;border-radius:14px}
.msg-other{align-self:flex-start;background:var(--surface-light);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.msg-mine{align-self:flex-end;background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.3);border-radius:14px 14px 4px 14px}
.msg-sender{font-size:11px;color:var(--text-muted);margin-bottom:3px}
.msg-content{font-size:14px;line-height:1.4}

/* ── Arena ── */
.arena-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arena-card{background:var(--surface-light);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 12px;text-align:center;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.arena-card:hover{border-color:rgba(255,45,85,.4);background:rgba(255,45,85,.06);box-shadow:0 0 20px rgba(255,45,85,.2)}
.arena-card .a-icon{font-size:28px;margin-bottom:6px}
.arena-card .a-name{font-size:12px;font-weight:700;margin-bottom:2px}
.arena-card .a-desc{font-size:10px;color:var(--text-muted);line-height:1.3}

/* ── Stat boxes ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:var(--surface-light);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.stat-val{font-size:20px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:var(--text-muted);margin-top:3px;font-weight:500}

/* ── Progress bar ── */
.progress-wrap{background:var(--muted);border-radius:4px;height:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;transition:width .4s ease;background:linear-gradient(90deg,var(--battle),var(--llamas))}

/* ── Misc ── */
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.hidden{display:none!important}
.glow-battle{box-shadow:0 0 16px 2px var(--battle-glow);animation:pulseBattle 2s ease-in-out infinite}
@keyframes pulseBattle{0%,100%{box-shadow:0 0 8px 1px var(--battle-glow)}50%{box-shadow:0 0 24px 4px var(--battle-glow)}}
</style>
</head>
<body>
<div id="app">
  <div id="toasts"></div>
  <div id="root"></div>
</div>
<script>
'use strict';
/* ═══════════════════ CONFIG ═══════════════════ */
const API='/api';
let _tok=localStorage.getItem('bf_tok')||'';
let _me=JSON.parse(localStorage.getItem('bf_me')||'null');
let _room=null;
let _gs={status:'waiting',mode:'',roomId:'',players:[],challenge:null,bottle:null};
let _pTimer=null,_hTimer=null,_lastEv=0,_hSeq=0,_page='';

/* ═══════════════════ API ═══════════════════ */
async function req(method,path,body,anon){
  const h={'Content-Type':'application/json'};
  if(_tok&&!anon) h['Authorization']='Bearer '+_tok;
  const o={method,headers:h};
  if(body&&method!=='GET') o.body=JSON.stringify(body);
  const r=await fetch(API+path,o);
  let d={};
  try{d=await r.json();}catch(_){}
  if(!r.ok) throw new Error(d.error||'Error '+r.status);
  return d.data!==undefined?d.data:d;
}

/* ═══════════════════ TOAST ═══════════════════ */
function toast(msg,t='i',ms=3500){
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className=`toast toast-${t}`;el.textContent=msg;
  c.appendChild(el);setTimeout(()=>el.remove(),ms);
}

/* ═══════════════════ ROUTER ═══════════════════ */
function go(page,props={}){
  _page=page;
  stopPoll();stopHilo();
  const root=document.getElementById('root');
  root.innerHTML='';
  if(page==='auth')   authPage(root);
  else if(page==='lobby')  lobbyPage(root);
  else if(page==='room')   roomPage(root,props);
  else if(page==='hilo')   hiloPage(root,props);
  else if(page==='arena')  arenaPage(root,props);
  else if(page==='profile')profilePage(root);
  else if(page==='premium')premiumPage(root);
}

function nav(icon,label,p,cur){
  return `<button class="nav-btn${cur===p?' active':''}" onclick="go('${p}')">
    ${icon}<span>${label}</span>
  </button>`;
}
function bottomNav(cur){
  return `<nav class="nav">
    ${nav(`<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,'Inicio','lobby',cur)}
    ${nav(`<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,'Arena','arena',cur)}
    ${nav(`<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,'Hilo','hilo_nav',cur)}
    ${nav(`<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,'Perfil','profile',cur)}
  </nav>`;
}

/* ════════════════ AUTH ════════════════ */
function authPage(root){
  root.innerHTML=`
  <div class="auth-wrap">
    <div>
      <div class="auth-logo">⚡BattleFlirt</div>
      <div class="auth-sub">El juego social más intenso</div>
    </div>
    <div class="card" style="width:100%;max-width:380px">
      <div style="display:flex;gap:6px;margin-bottom:18px">
        <button class="btn btn-battle" id="tl-in" onclick="swTab('in')" style="flex:1">Entrar</button>
        <button class="btn btn-surface" id="tl-up" onclick="swTab('up')" style="flex:1">Registrarse</button>
      </div>
      <div id="pn-in">
        <div class="field"><label>Email</label><input id="l-e" type="email" placeholder="tu@email.com"/></div>
        <div class="field"><label>Contraseña</label><input id="l-p" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
        <button class="btn btn-battle" onclick="doLogin()">Entrar →</button>
      </div>
      <div id="pn-up" class="hidden">
        <div class="field"><label>Usuario</label><input id="r-u" placeholder="nombredeusuario"/></div>
        <div class="field"><label>Email</label><input id="r-e" type="email" placeholder="tu@email.com"/></div>
        <div class="field"><label>Contraseña</label><input id="r-p" type="password" placeholder="Mínimo 8 caracteres"/></div>
        <div class="field"><label>Edad</label><input id="r-a" type="number" min="16" max="99" placeholder="18"/></div>
        <div class="field"><label>Código referido (opcional)</label><input id="r-r" placeholder="BF-XXXXXXXX"/></div>
        <button class="btn btn-battle" onclick="doReg()">Crear cuenta ✨</button>
      </div>
    </div>
  </div>`;
}
function swTab(t){
  document.getElementById('pn-in').classList.toggle('hidden',t!=='in');
  document.getElementById('pn-up').classList.toggle('hidden',t!=='up');
  document.getElementById('tl-in').className=`btn ${t==='in'?'btn-battle':'btn-surface'}`;
  document.getElementById('tl-up').className=`btn ${t==='up'?'btn-battle':'btn-surface'}`;
}
async function doLogin(){
  const e=v('l-e'),p=v('l-p');
  if(!e||!p)return toast('Completa los campos','e');
  try{const d=await req('POST','/auth/login',{email:e,password:p},true);save(d);toast('¡Bienvenido! 🔥','s');go('lobby');}
  catch(er){toast(er.message,'e');}
}
async function doReg(){
  const u=v('r-u'),e=v('r-e'),p=v('r-p'),a=parseInt(v('r-a'))||null,ref=v('r-r');
  if(!u||!e||!p)return toast('Completa los campos obligatorios','e');
  if(p.length<8)return toast('Contraseña mínimo 8 caracteres','e');
  try{const body={username:u,email:e,password:p,age:a};if(ref)body.referralCode=ref;
    const d=await req('POST','/auth/register',body,true);save(d);toast('+100 LLAMAS de bienvenida 🦙','s',5000);go('lobby');}
  catch(er){toast(er.message,'e');}
}
function save(d){_tok=d.accessToken||d.token;_me=d.user;localStorage.setItem('bf_tok',_tok);localStorage.setItem('bf_me',JSON.stringify(_me));}

/* ════════════════ LOBBY ════════════════ */
const MODES=[
  {id:'botella',   icon:'🍾',name:'Pico Botella',     sub:'Gira y reta'},
  {id:'verdad_reto',icon:'🎯',name:'Verdad o Reto',   sub:'Clásico y divertido'},
  {id:'battle_1v1',icon:'⚔️',name:'Batalla 1v1',     sub:'Duelo directo'},
  {id:'liga',      icon:'🏆',name:'Modo Liga',        sub:'Puntos y ranking'},
  {id:'juicio',    icon:'⚖️',name:'El Juicio',        sub:'El grupo decide'},
  {id:'oscuro',    icon:'🌑',name:'Modo Oscuro',      sub:'Premium 18+ 🔒'},
  {id:'cartas',    icon:'🃏',name:'Cartas sobre la Mesa',sub:'Destino revelado'},
  {id:'termometro',icon:'🌡️',name:'Termómetro Humano',sub:'¿Quién más...?'},
  {id:'actores',   icon:'🎭',name:'Actores sin Guion', sub:'Roles secretos'},
  {id:'ultimo_pie',icon:'🏅',name:'El Último en Pie', sub:'Acumulativo'},
  {id:'todo_nada', icon:'🎲',name:'Todo o Nada',      sub:'Apuesta LLAMAS'},
];
let _selMode='botella';

async function lobbyPage(root){
  let bal=0;
  try{const b=await req('GET','/llamas/balance');bal=b.balance??0;}catch(_){}
  root.innerHTML=`
  <div class="hdr">
    <div class="logo">⚡BattleFlirt</div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="chip chip-llamas">🦙 ${bal}</span>
      <button class="btn btn-sm btn-icon" onclick="claimDaily()" title="Bono diario">🎁</button>
    </div>
  </div>
  <div class="page">
    <p class="section-title" style="margin-top:4px">Selecciona el modo</p>
    <div class="mode-grid" id="mode-grid"></div>

    <div style="margin-top:14px;display:flex;gap:8px;align-items:center;background:var(--surface-light);border:2px solid var(--battle);border-radius:var(--r-lg);padding:14px 16px;box-shadow:0 0 24px 2px var(--battle-glow)">
      <span id="sel-icon" style="font-size:28px">🍾</span>
      <div style="flex:1"><div id="sel-name" style="font-weight:700;font-size:15px">Pico Botella</div>
        <div id="sel-sub" style="font-size:11px;color:var(--text-muted)">Gira y reta</div></div>
      <button class="btn btn-battle btn-sm" style="width:auto" onclick="showCreate()">Crear sala →</button>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-bottom:10px">Unirse a sala</div>
      <div style="display:flex;gap:8px">
        <input id="jc" placeholder="Código de sala" style="flex:1;text-transform:uppercase;letter-spacing:.1em" maxlength="10" onkeydown="if(event.key==='Enter')joinRoom()"/>
        <button class="btn btn-llamas" style="width:auto;padding:11px 18px" onclick="joinRoom()">→</button>
      </div>
    </div>

    <div id="create-form" class="card hidden" style="margin-top:14px">
      <div class="section-title" style="margin-bottom:10px">Crear sala</div>
      <div class="field"><label>Máx. jugadores</label>
        <select id="max-p"><option value="4">4 jugadores</option><option value="6">6 jugadores</option><option value="8" selected>8 jugadores</option><option value="12">12 jugadores</option></select>
      </div>
      <button class="btn btn-battle glow-battle" onclick="createRoom()">🚀 Crear sala</button>
    </div>
  </div>
  ${bottomNav('lobby')}`;

  const grid=document.getElementById('mode-grid');
  MODES.forEach(m=>{
    const d=document.createElement('div');
    d.className='mode-card'+(m.id===_selMode?' selected':'');
    d.dataset.id=m.id;
    d.innerHTML=`<span class="m-icon">${m.icon}</span><div><div class="m-name">${m.name}</div><div class="m-sub">${m.sub}</div></div>`;
    d.onclick=()=>{
      _selMode=m.id;
      document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
      d.classList.add('selected');
      document.getElementById('sel-icon').textContent=m.icon;
      document.getElementById('sel-name').textContent=m.name;
      document.getElementById('sel-sub').textContent=m.sub;
    };
    grid.appendChild(d);
  });
}

function showCreate(){
  document.getElementById('create-form').classList.remove('hidden');
  document.getElementById('create-form').scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function createRoom(){
  const maxPlayers=parseInt(document.getElementById('max-p').value);
  try{const d=await req('POST','/rooms',{mode:_selMode,maxPlayers});
    _room=d.room??d;toast('Sala creada: '+_room.code,'s');go('room',{roomId:_room.id});}
  catch(er){toast(er.message,'e');}
}

async function joinRoom(){
  const code=v('jc').toUpperCase().trim();
  if(!code)return toast('Ingresa el código','e');
  try{const r=await req('GET','/rooms/'+code);const rm=r.room??r;
    await req('POST','/rooms/'+rm.id+'/join');_room=rm;toast('¡Unido! 🎉','s');go('room',{roomId:rm.id});}
  catch(er){toast(er.message,'e');}
}

async function claimDaily(){
  try{const d=await req('POST','/llamas/daily');toast('+'+d.amount+' LLAMAS 🦙','s');go('lobby');}

/* ════════════════ ROOM ════════════════ */
async function roomPage(root,{roomId}){
  _gs={status:'waiting',mode:'',roomId,players:[],challenge:null,bottle:null};
  try{const s=await req('GET','/rooms/'+roomId+'/state');const rm=s.room??s;
    _gs.mode=rm.mode||'';_gs.status=rm.status||'waiting';if(!_room)_room=rm;}catch(_){}
  await loadPlayers(roomId);
  drawRoom(root,roomId);
  startPoll(roomId);
}

function drawRoom(root,roomId){
  const gs=_gs;
  const isHost=gs.players.length>0&&gs.players[0].userId===(_me?.id);
  const mode=MODES.find(m=>m.id===gs.mode)||{icon:'🎮',name:gs.mode};
  root.innerHTML=`
  <div class="hdr">
    <button class="btn btn-sm btn-surface" style="width:auto;gap:4px" onclick="leaveRoom('${roomId}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Salir
    </button>
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:18px">${mode.icon}</span>
      <span style="font-weight:700;font-size:15px">${mode.name}</span>
    </div>
    <button class="btn btn-sm btn-surface" style="width:auto" onclick="go('hilo',{roomId:'${roomId}'})">💬 Hilo</button>
  </div>
  <div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span class="chip chip-blue">🔑 ${_room?.code||''}</span>
      <span class="chip ${gs.status==='playing'?'chip-battle':'chip-green'}">${gs.status==='playing'?'● En juego':'● Esperando'}</span>
    </div>
    <div id="player-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px"></div>
    ${gs.status==='waiting'?(isHost
      ?`<button class="btn btn-battle glow-battle" onclick="startGame('${roomId}')">▶ Iniciar juego</button>`
      :`<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:16px">Esperando al anfitrión...</div>`):''}
    <div id="game-zone" style="margin-top:12px"></div>
    ${gs.status==='playing'?`
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-surface" style="flex:1" onclick="sendInterest('${roomId}')">❤️ Me interesa</button>
      <button class="btn btn-surface" style="flex:1" onclick="go('arena',{roomId:'${roomId}'})">🏟️ Arena</button>
    </div>
    ${isHost?`<button class="btn btn-surface btn-sm" style="margin-top:8px;width:100%" onclick="endGame('${roomId}')">🏁 Terminar partida</button>`:''}`:'' }
  </div>`;
  paintPlayers();
  paintGame(roomId);
}

async function loadPlayers(roomId){
  try{const d=await req('GET','/rooms/'+roomId+'/players');
    _gs.players=(d.players??d).map(p=>({userId:p.userId||p.user_id,username:p.username,score:p.score||0}));}
  catch(_){}
}

function paintPlayers(){
  const el=document.getElementById('player-list');if(!el)return;
  el.innerHTML=_gs.players.map((p,i)=>`
    <div class="player-row">
      <div class="av" style="${i===0?'border:2px solid var(--battle)':''}">${(p.username||'?')[0].toUpperCase()}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(p.username)}</div>
        ${i===0?`<div style="font-size:10px;color:var(--battle);font-weight:600">ANFITRIÓN</div>`:''}
      </div>
      <div class="chip chip-llamas" style="font-size:11px">🏆 ${p.score}</div>
    </div>`).join('');
}

function paintGame(roomId){
  const el=document.getElementById('game-zone');if(!el||_gs.status!=='playing')return;
  const gs=_gs,m=gs.mode;
  const others=gs.players.filter(p=>p.userId!==_me?.id);

  if(gs.challenge){el.innerHTML=chalHtml(roomId,gs.challenge);return;}

  if(m==='botella'){
    el.innerHTML=`<div class="challenge-box" style="text-align:center">
      <div style="font-size:56px;margin:8px 0">${gs.bottle?'→'+esc(gs.bottle):'🍾'}</div>
      <div style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Gira para elegir a alguien</div>
      <button class="btn btn-battle" onclick="ga('${roomId}','spin_bottle',{})">Girar la botella 🍾</button></div>`;

    el.innerHTML=`<div class="challenge-box">
      <div style="font-size:15px;font-weight:600;margin-bottom:16px">¿Qué eliges?</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-battle" style="flex:1" onclick="ga('${roomId}','draw_challenge',{type:'truth'})">🤔 Verdad</button>
        <button class="btn btn-llamas" style="flex:1" onclick="ga('${roomId}','draw_challenge',{type:'dare'})">🎯 Reto</button>
      </div></div>`;
  } else if(m==='oscuro'){
    el.innerHTML=`<div class="challenge-box">
      <div style="font-size:15px;font-weight:600;margin-bottom:16px">Modo Oscuro 🌑</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-battle" style="flex:1" onclick="ga('${roomId}','draw_challenge',{type:'truth'})">🤔 Verdad</button>
        <button class="btn btn-llamas" style="flex:1" onclick="ga('${roomId}','draw_challenge',{type:'dare'})">🎯 Reto</button>
        <button class="btn btn-surface" style="width:100%;margin-top:4px" onclick="ga('${roomId}','draw_challenge',{type:'dark'})">🌑 Reto Oscuro</button>
      </div></div>`;
  } else if(m==='battle_1v1'){
    el.innerHTML=`<div class="challenge-box"><div style="font-size:15px;font-weight:600;margin-bottom:12px">⚔️ Reta a alguien</div>
      ${others.map(p=>`<button class="btn btn-battle" style="margin-bottom:8px" onclick="ga('${roomId}','challenge_player',{targetUserId:'${p.userId}'})">⚔️ vs ${esc(p.username)}</button>`).join('')||'<p style="color:var(--text-muted);font-size:13px">Esperando más jugadores</p>'}</div>`;
  } else if(m==='juicio'){
    el.innerHTML=`<div class="challenge-box"><div style="font-size:15px;font-weight:600;margin-bottom:12px">⚖️ El Juicio</div>
      <button class="btn btn-battle" style="margin-bottom:12px" onclick="ga('${roomId}','draw_challenge',{type:'truth'})">Nueva pregunta ⚖️</button>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Vota quién es más probable:</div>
      ${others.map(p=>`<button class="btn btn-surface" style="margin-bottom:6px" onclick="ga('${roomId}','vote',{voteType:'juicio',targetUserId:'${p.userId}'})">👆 ${esc(p.username)}</button>`).join('')}</div>`;
  } else if(m==='actores'){
    el.innerHTML=`<div class="challenge-box"><div style="font-size:15px;font-weight:600;margin-bottom:12px">🎭 Los Actores</div>
      <button class="btn btn-battle" style="margin-bottom:10px" onclick="ga('${roomId}','assign_roles',{})">Asignar roles 🎭</button>
      <div id="my-role"></div></div>`;
  } else if(m==='termometro'){
    el.innerHTML=`<div class="challenge-box"><div style="font-size:15px;font-weight:600;margin-bottom:12px">🌡️ Termómetro Humano</div>
      <button class="btn btn-battle" onclick="ga('${roomId}','draw_challenge',{type:'truth'})">Siguiente pregunta 🌡️</button></div>`;
  } else if(m==='ultimo_pie'){
    el.innerHTML=`<div class="challenge-box"><div style="font-size:15px;font-weight:600;margin-bottom:12px">🏅 El Último en Pie</div>
      <button class="btn btn-battle" style="margin-bottom:8px" onclick="ga('${roomId}','draw_challenge',{type:'dare'})">Siguiente reto 🎯</button>

  } else if(m==='liga'){
    el.innerHTML=`<div class="challenge-box"><div style="font-size:15px;font-weight:600;margin-bottom:12px">🏆 Modo Liga</div>

function chalHtml(roomId,ch){
  const cols={truth:'var(--blue)',dare:'var(--llamas)',dark:'#9333ea',battle:'var(--battle)'};
  const c=cols[ch.type]||'var(--battle)';
  const tl={truth:'🤔 Verdad',dare:'🎯 Reto',dark:'🌑 Oscuro',battle:'⚔️ Battle'};
  return `<div class="challenge-box" style="border-color:${c}4d">
    <div class="challenge-type" style="background:${c}20;color:${c};border:1px solid ${c}40">${tl[ch.type]||ch.type}${ch.intensity?' · Nivel '+ch.intensity:''}</div>
    ${ch.targetUsername?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Para: <b style="color:var(--text)">${esc(ch.targetUsername)}</b></div>`:''}
    <div class="challenge-text">${esc(ch.text)}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-battle" style="flex:1" onclick="ga('${roomId}','challenge_completed',{challengeId:'${ch.id||''}'})">✅ Completado</button>
      <button class="btn btn-surface" style="flex:1" onclick="ga('${roomId}','challenge_skipped',{challengeId:'${ch.id||''}'})">⏭️ Saltar</button>
    </div></div>`;
}

async function ga(roomId,action,data){
  try{const d=await req('POST','/game/'+roomId+'/action',{action,...data});
    handleEvs(Array.isArray(d)?d:(d.events||[d]));}
  catch(er){toast(er.message,'e');}
}

function handleEvs(evs){
  for(const e of evs||[]){
    if(!e||!e.event_type)continue;
    const p=typeof e.payload==='string'?JSON.parse(e.payload||'{}'):(e.payload||{});
    switch(e.event_type){
      case 'game:start':case'game:started':
        _gs.status='playing';toast('¡Juego iniciado! 🎮','s');
        drawRoom(document.getElementById('root'),_gs.roomId);break;
      case 'game:challenge':
        _gs.challenge=p.challenge||p;paintGame(_gs.roomId);break;
      case 'game:challenge_completed':case'game:challenge_skipped':
        _gs.challenge=null;
        if(p.llamasDelta)toast((p.llamasDelta>0?'+':'')+p.llamasDelta+' LLAMAS 🦙','i');
        paintGame(_gs.roomId);break;
      case 'game:bottle_spin':
        _gs.bottle=p.targetUsername;paintGame(_gs.roomId);break;
      case 'game:roles_assigned':
        const role=(p.roles||{})[_me?.id];
        if(role){const el=document.getElementById('my-role');if(el)el.innerHTML=`<div class="chip chip-purple" style="margin:0 auto">Tu rol: ${esc(role)} 🎭</div>`;}break;
      case 'room:match_reveal':
        toast('💘 ¡Match con '+esc(p.targetUsername||'alguien')+'!','s',6000);break;
      case 'game:end':_gs.status='finished';break;
    }
  }
}

async function startGame(roomId){await ga(roomId,'game_start',{});}
async function endGame(roomId){
  try{const d=await req('POST','/rooms/'+roomId+'/end');
    if((d.matches||[]).length)toast('💘 '+(d.matches.length)+' match(es) revelados!','s',5000);
    toast('Partida terminada 🏁','i');stopPoll();go('lobby');}
  catch(er){toast(er.message,'e');}
}
async function leaveRoom(roomId){try{await req('POST','/rooms/'+roomId+'/leave');}catch(_){}stopPoll();go('lobby');}
async function sendInterest(roomId){try{await req('POST','/rooms/'+roomId+'/interest');toast('❤️ Interés registrado (privado)','i');}catch(er){toast(er.message,'e');}}
async function doBet(roomId,c){const a=parseInt(document.getElementById('bet')?.value)||0;if(a<10)return toast('Mínimo 10 LLAMAS','e');await ga(roomId,'todo_nada_bet',{amount:a,choice:c});toast('Apuesta: '+a+' LLAMAS '+c,'i');}

function startPoll(roomId){_lastEv=0;_pTimer=setInterval(async()=>{
  try{const d=await req('GET','/game/'+roomId+'/events?since='+_lastEv);
    const evs=d.events??d;if(evs.length){_lastEv=evs[evs.length-1].id||_lastEv;handleEvs(evs);await loadPlayers(roomId);paintPlayers();}}
  catch(_){}},2000);}
function stopPoll(){if(_pTimer){clearInterval(_pTimer);_pTimer=null;}}

async function loadHilo(roomId){
  try{const d=await req('GET','/hilo/'+roomId+'/messages?since='+_hSeq);
    const msgs=d.messages||[];setTension(d.tension??0,d.level??{});
    if(msgs.length){_hSeq=msgs[msgs.length-1].seq||_hSeq;appendMsgs(msgs);}}catch(_){}
}

function setTension(t,lvl){
  const bar=document.getElementById('t-bar'),name=document.getElementById('t-name'),num=document.getElementById('t-num'),chip=document.getElementById('t-chip');
  if(!bar)return;
  const cols={1:'var(--blue)',2:'var(--green)',3:'var(--llamas)',4:'var(--battle)',5:'#7f1d1d'};
  bar.style.width=t+'%';bar.style.background=cols[lvl.level||1]||'var(--battle)';
  if(name)name.textContent='Nivel '+(lvl.level||1)+' — '+(lvl.name||'Frío');
  if(num)num.textContent=t+'/100';
  if(chip)chip.textContent='⚡ '+t;
}

function appendMsgs(msgs){
  const c=document.getElementById('chat');if(!c)return;
  for(const m of msgs){
    const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column';
    const isMine=false;
    d.innerHTML=`<div class="msg ${isMine?'msg-mine':'msg-other'}" data-id="${m.id}">
      <div class="msg-sender">${esc(m.username||'Anon')}</div>
      <div class="msg-content">${esc(m.content)}</div>
      ${(m.reactions||[]).map(r=>`<span style="font-size:11px;background:var(--muted);border-radius:10px;padding:2px 7px;margin-top:4px;cursor:pointer;display:inline-block" onclick="addReact('${m.id}','${roomId}')">${r.reaction} ${r.count}</span>`).join('')}
    </div>
    <div style="font-size:10px;color:var(--text-muted);margin:2px 4px;cursor:pointer" onclick="addReact('${m.id}','${roomId}')">+ reaccionar</div>`;
    c.appendChild(d);
  }
  c.scrollTop=c.scrollHeight;
}

async function sendMsg(roomId){
  const inp=document.getElementById('mi'),type=document.getElementById('mt').value;
  const content=inp?.value.trim();if(!content)return;
  try{const d=await req('POST','/hilo/'+roomId+'/messages',{content,type,anonymous:type==='anonimo'});
    inp.value='';if(d.message)appendMsgs([d.message]);setTension(d.tension,d.level||{});
    if(d.leveledUp)toast('🔥 ¡Nivel de tensión subió!','s');}
  catch(er){toast(er.message,'e');}
}

function addReact(msgId,roomId){
  const em=['❤️','😂','🔥','💋','😮','👀','🤔','💀'][Math.floor(Math.random()*8)];
  req('POST','/hilo/'+roomId+'/react',{messageId:msgId,reaction:em}).then(d=>{toast('Reacción '+em,'i');setTension(d.tension,d.level||{});}).catch(e=>toast(e.message,'e'));
}

function openConf(roomId){
  const t=prompt('💋 Tu confesión anónima (requiere nivel 4+):');if(!t)return;
  req('POST','/hilo/'+roomId+'/confession',{text:t,anonymous:true})
    .then(d=>{toast('💋 Enviado +10 carisma','s');if(d.message)appendMsgs([d.message]);})
    .catch(e=>toast(e.message,'e'));
}

function stopHilo(){if(_hTimer){clearInterval(_hTimer);_hTimer=null;}_hSeq=0;}

async function launchFeat(roomId,feat){
  if(feat==='ruleta')return spinRuleta();
  if(feat==='corona_semanal'){try{const d=await req('GET','/arena/corona');alert('👑 Corona Semanal\n\n'+(d.top3||[]).map((u,i)=>`${['🥇','🥈','🥉'][i]} ${u.username}: ${u.weeklyPoints} pts`).join('\n')||'Sin datos');}catch(e){toast(e.message,'e');}return;}
  if(!roomId)return toast('Únete a una sala primero','e');
  try{const d=await req('POST','/arena/'+roomId+'/start',{feature:feat});
    const sid=d.stadiumId||d.stadium_id||d.id;toast('🏟️ '+feat+' iniciado!','s');
    renderFeat(document.getElementById('root'),roomId,feat,sid);}
  catch(e){toast(e.message,'e');}
}

async function spinRuleta(){
  try{const d=await req('GET','/arena/ruleta');const r=d.result||d;
    toast('🎰 '+r.label,r.llamasDelta<0?'e':r.llamasDelta>0?'s':'i',5000);}
  catch(e){toast(e.message,'e');}
}

function renderFeat(root,roomId,feat,sid){
  const fi=AFEATS.find(f=>f.id===feat)||{icon:'🏟️',name:feat};
  const others=_gs.players.filter(p=>p.userId!==_me?.id);
  let inner='';
  if(feat==='silla_caliente'){
    inner=`<div class="section-title">¿Quién se sienta?</div>
      ${others.map(p=>`<button class="btn btn-battle" style="margin-bottom:8px" onclick="aAct('${roomId}','${sid}','silla_start',{targetUserId:'${p.userId}'})">🪑 ${esc(p.username)}</button>`).join('')}`;
  }else if(feat==='sobre_rojo'){
    inner=`<div class="section-title">💌 Sobre Rojo (−30 LLAMAS)</div>
      <div class="field"><textarea id="sq" placeholder="Tu pregunta anónima..." rows="3"></textarea></div>
      <div class="field"><label>Para</label><select id="sto">${others.map(p=>`<option value="${p.userId}">${esc(p.username)}</option>`).join('')}</select></div>
      <button class="btn btn-battle" onclick="sendSobre('${roomId}','${sid}')">Enviar 💌</button>`;
  }else if(feat==='momento_epico'){
    inner=`<div class="section-title">🏆 Momento Épico</div>
      <div class="field"><textarea id="ed" placeholder="Describe el momento..." rows="3"></textarea></div>
      <button class="btn btn-battle" style="margin-bottom:10px" onclick="nomEpic('${roomId}','${sid}')">Nominar 🏆</button>
      <div class="section-title">Votar</div>
      ${others.map(p=>`<button class="btn btn-surface" style="margin-bottom:6px" onclick="aVote('${roomId}','${sid}','epic_vote',{targetId:'${p.userId}'})">👆 ${esc(p.username)}</button>`).join('')}`;
  }else if(feat==='shipper'){
    inner=`<div class="section-title">💘 Mejor Ship</div>
      <div class="field"><label>Persona A</label><select id="sa">${others.map(p=>`<option value="${p.userId}">${esc(p.username)}</option>`).join('')}</select></div>
      <div class="field"><label>Persona B</label><select id="sb">${others.map((p,i)=>`<option value="${p.userId}"${i===1?' selected':''}>${esc(p.username)}</option>`).join('')}</select></div>
      <button class="btn btn-battle" onclick="vShip('${roomId}','${sid}')">Votar 💘</button>`;
  }else if(feat==='quien_curso'){
    inner=`<button class="btn btn-battle" style="margin-bottom:12px" onclick="aAct('${roomId}','${sid}','quien_draw',{})">Nueva pregunta 🎓</button>
      <div id="qq" class="challenge-text" style="font-size:16px"></div>
      ${others.map(p=>`<button class="btn btn-surface" style="margin-bottom:6px;margin-top:6px" onclick="aVote('${roomId}','${sid}','quien_vote',{targetId:'${p.userId}'})">👆 ${esc(p.username)}</button>`).join('')}`;
  }else{
    inner=`<button class="btn btn-battle" onclick="aAct('${roomId}','${sid}','action',{})">Siguiente ▶</button>`;
  }
  root.innerHTML=`
  <div class="hdr">
    <button class="btn btn-sm btn-surface" style="width:auto" onclick="arenaPage(document.getElementById('root'),{roomId:'${roomId}'})">← Arena</button>
    <span style="font-weight:700">${fi.icon} ${fi.name}</span>
    <button class="btn btn-sm btn-surface" style="width:auto" onclick="endArena('${roomId}','${sid}')">Fin</button>
  </div>
  <div class="page"><div class="card">${inner}</div>
    <div id="ares" style="margin-top:14px"></div></div>`;
}

async function aAct(rid,sid,action,data){
  try{const d=await req('POST','/arena/'+rid+'/action',{action,stadiumId:sid,...data});
    const aqq=document.getElementById('qq');if(aqq&&(d.question||d.challenge))aqq.textContent=d.question||d.challenge?.text||'';
    showARes(d);}catch(e){toast(e.message,'e');}
}
async function aVote(rid,sid,voteType,data){
  try{const d=await req('POST','/arena/'+rid+'/vote',{voteType,stadiumId:sid,...data});toast('Voto ✅','s');showARes(d);}catch(e){toast(e.message,'e');}
}
async function sendSobre(rid,sid){const q=document.getElementById('sq')?.value.trim(),t=document.getElementById('sto')?.value;if(!q)return toast('Escribe la pregunta','e');await aAct(rid,sid,'sobre_send',{targetUserId:t,question:q});toast('💌 Enviado (−30 LLAMAS)','i');}
async function nomEpic(rid,sid){const d=document.getElementById('ed')?.value.trim();if(!d)return toast('Describe el momento','e');await aAct(rid,sid,'epic_nominate',{description:d});toast('🏆 Nominado','s');}
async function vShip(rid,sid){const a=document.getElementById('sa')?.value,b=document.getElementById('sb')?.value;if(!a||!b||a===b)return toast('Elige 2 personas diferentes','e');try{const d=await req('POST','/arena/'+rid+'/vote',{voteType:'ship',stadiumId:sid,targetIds:[a,b]});toast('💘 Ship votado','s');showARes(d);}catch(e){toast(e.message,'e');}}
async function endArena(rid,sid){try{const d=await req('POST','/arena/'+rid+'/end',{stadiumId:sid});showARes(d.results||d);toast('Arena terminada','i');}catch(e){toast(e.message,'e');}}
function showARes(d){const el=document.getElementById('ares');if(!el||!d)return;el.innerHTML=`<div class="card"><pre style="font-size:11px;overflow-x:auto;color:var(--text-muted);white-space:pre-wrap">${JSON.stringify(d,null,2)}</pre></div>`;}

/* ════════════════ PROFILE ════════════════ */
async function profilePage(root){
  root.innerHTML=`<div class="hdr"><div class="logo">👤 Perfil</div><button class="btn btn-sm btn-surface" style="width:auto" onclick="logout()">Salir</button></div>
  <div class="page"><div style="text-align:center;color:var(--text-muted);padding:40px">⏳ Cargando...</div></div>${bottomNav('profile')}`;
  try{
    const [pro,cha,bag,lla,ref]=await Promise.all([
      req('GET','/users/me/profile'),req('GET','/users/me/charisma'),req('GET','/users/me/badges'),req('GET','/llamas/balance'),req('GET','/referrals/code').catch(()=>null)
    ]);
    const p=pro.profile||pro,c=cha.charisma||cha,bs=(bag.badges||bag)||[],bal=lla.balance??0,prog=c.progressToNext||{};
    root.innerHTML=`
    <div class="hdr"><div class="logo">👤 Perfil</div><button class="btn btn-sm btn-surface" style="width:auto" onclick="logout()">Salir</button></div>
    <div class="page">
      <div class="card" style="text-align:center;margin-bottom:12px">
        <div class="av" style="width:60px;height:60px;font-size:26px;margin:0 auto 10px;border:2px solid var(--battle)">${(p.username||'?')[0].toUpperCase()}</div>
        <div style="font-size:20px;font-weight:800">${esc(p.username)}</div>
        <div style="color:var(--text-muted);font-size:13px;margin:2px 0 8px">${esc(p.email||'')}</div>
        ${p.isPremium?'<span class="chip chip-llamas">⭐ Premium</span>':''}
        <div class="stat-grid" style="margin-top:12px">
          <div class="stat-box"><div class="stat-val" style="color:var(--llamas)">${bal}</div><div class="stat-lbl">LLAMAS 🦙</div></div>
          <div class="stat-box"><div class="stat-val">${c.totalPoints||0}</div><div class="stat-lbl">Carisma ✨</div></div>
          <div class="stat-box"><div class="stat-val" style="color:var(--battle);font-size:14px">${c.rank?.name||'Spark'}</div><div class="stat-lbl">Rango 🏅</div></div>
        </div>
      </div>
      ${prog.pointsNeeded?`
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px">
          <span>${c.rank?.name||'Spark'}</span><span class="text-muted">${prog.pointsNeeded} pts para subir</span>
        </div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${prog.pct||0}%"></div></div>
      </div>`:''}
      ${ref?`
      <div class="card" style="margin-bottom:12px">
        <div class="section-title">🔗 Código de referido</div>
        <div style="display:flex;gap:8px;align-items:center">
          <code style="background:var(--muted);padding:8px 12px;border-radius:var(--r-sm);flex:1;font-size:13px;letter-spacing:.05em">${esc(ref.code||'')}</code>
          <button class="btn btn-sm btn-surface" style="width:auto" onclick="navigator.clipboard.writeText('${ref.code||''}').then(()=>toast('¡Copiado!','s'))">Copiar</button>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:6px">👥 ${ref.totalReferred||0} referidos · 🦙 ${ref.llamasEarned||0} LLAMAS ganadas</div>
      </div>`:''}
      <div class="card" style="margin-bottom:12px">
        <div class="section-title">🏅 Insignias (${bs.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${bs.length?bs.map(b=>`<span class="chip chip-battle">${bEm(b.badge_type)} ${b.badge_type.replace(/_/g,' ')}</span>`).join(''):'<span style="color:var(--text-muted);font-size:13px">Sin insignias todavía</span>'}
        </div>
      </div>
      <button class="btn btn-llamas" onclick="go('premium')">${p.isPremium?'⭐ Gestionar Premium':'⭐ Obtener Premium ($4.99/mes)'}</button>
    </div>
    ${bottomNav('profile')}`;
  }catch(e){root.innerHTML+=`<div style="text-align:center;color:var(--battle);padding:40px">${e.message}</div>`;}
}

function bEm(t){return{first_match:'💘',ten_games:'🎮',dark_unlocked:'🌑',llamas_millionaire:'🦙',rank_legend:'👑',weekly_crown:'🏆',epic_moment:'⚡',premium_member:'⭐',beta_tester:'🧪'}[t]||'🏅';}
function logout(){_tok='';_me=null;_room=null;localStorage.removeItem('bf_tok');localStorage.removeItem('bf_me');go('auth');}

/* ════════════════ PREMIUM ════════════════ */
async function premiumPage(root){
  let st=null;try{st=await req('GET','/payments/status');}catch(_){}
  root.innerHTML=`
  <div class="hdr"><button class="btn btn-sm btn-surface" style="width:auto" onclick="go('profile')">← Perfil</button>
    <div class="logo" style="font-size:18px">⭐ Premium</div><div></div></div>
  <div class="page">
    ${st?.active?`
    <div class="card" style="text-align:center;border-color:rgba(234,179,8,.4);box-shadow:0 0 24px rgba(234,179,8,.15);margin-bottom:14px">
      <div style="font-size:48px;margin:8px 0">⭐</div>
      <div style="font-size:20px;font-weight:800;color:var(--yellow)">Premium Activo</div>
      <div style="color:var(--text-muted);font-size:13px;margin-top:6px">Expira: ${st.expiresAt?new Date(st.expiresAt).toLocaleDateString('es'):'—'}</div>
      <button class="btn btn-surface" style="margin-top:16px;width:auto" onclick="cancelPrem()">Cancelar suscripción</button>
    </div>`:`
    <div class="card" style="text-align:center;margin-bottom:14px;border-color:rgba(255,107,0,.3);box-shadow:0 0 24px var(--llamas-glow)">
      <div style="font-size:48px;margin:8px 0">⚡</div>
      <div style="font-size:22px;font-weight:900">BattleFlirt Premium</div>
      <div style="font-size:26px;font-weight:800;color:var(--llamas);margin:6px 0">$4.99 / mes</div>
      <div style="text-align:left;margin:14px 0 18px">
        ${['🌑 Modo Oscuro 18+','💌 Sobre Rojo anónimo','🔒 Hilo Secreto','🔥 Mensajes Ardientes','🦙 +200 LLAMAS de bienvenida','🏅 Badge exclusivo'].map(f=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:13px"><span style="color:var(--green)">✓</span>${f}</div>`).join('')}
      </div>
      <button class="btn btn-llamas" onclick="doPrem()">⭐ Obtener Premium</button>
    </div>`}
    <div class="card">
      <div class="section-title">🧪 Beta Code</div>
      <div style="display:flex;gap:8px">
        <input id="bc" placeholder="BETA-XXXXXXXX" style="flex:1"/>
        <button class="btn btn-battle" style="width:auto;padding:11px 16px" onclick="redeemBeta()">Canjear</button>
      </div>
    </div>
  </div>`;
}
async function doPrem(){try{const d=await req('POST','/payments/create-subscription',{});if(d.alreadyPremium)return toast('Ya tienes Premium','i');if(d.checkoutUrl)location.href=d.checkoutUrl;else toast('Stripe no configurado — contacta al admin','e');}catch(e){toast(e.message,'e');}}
async function cancelPrem(){if(!confirm('¿Cancelar? Mantendrás acceso hasta fin del período.'))return;try{await req('POST','/payments/cancel',{});toast('Cancelado','i');go('premium');}catch(e){toast(e.message,'e');}}
async function redeemBeta(){const c=document.getElementById('bc')?.value.trim();if(!c)return toast('Ingresa el código','e');try{const d=await req('POST','/beta/redeem',{code:c});toast(d.message||'¡Canjeado! +150 LLAMAS','s',5000);go('premium');}catch(e){toast(e.message,'e');}}

/* ════════════════ UTILS ════════════════ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function v(id){return(document.getElementById(id)?.value||'').trim();}

/* ════════════════ BOOT ════════════════ */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get('premium')==='success'){toast('¡Pago exitoso! Premium activo 🎉','s',6000);history.replaceState({},'','/');}
  const ref=p.get('ref');
  if(ref&&_tok&&_me){req('POST','/referrals/apply',{code:ref}).then(()=>toast('+50 LLAMAS por referido!','s')).catch(()=>{});history.replaceState({},'','/');}
  if(_tok&&_me){go('lobby');req('GET','/auth/me').catch(()=>{_tok='';localStorage.removeItem('bf_tok');go('auth');});}
  else go('auth');
})();
</script>
</body>
